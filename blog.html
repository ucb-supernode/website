---
layout: default 
title: Blog 
navbar: false
permalink: /blog/
---
  <ul class="post-list">
    {% for post in site.posts %}
      <li>
        <span class="post-meta">{{ post.date | date: "%b %-d, %Y" }}</span>

        <h2>
          <a class="post-link" href="{{ post.url | prepend: site.baseurl }}">{{ post.title }}</a>
        </h2>
        <p>
          {{ post.excerpt }}
        </p>
        <a href="{{ post.url | prepend: site.baseurl }}">&gt;&gt;</a>
      </li>
    {% endfor %}
  </ul>
